# Use with:  export DBT_PROFILES_DIR=.   (run from the project root)
sales_pipeline:
  target: dev
  outputs:

    # Your real warehouse. 
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"      
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"    
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: INTUS_ANALYTICS
      schema: DBT_EUCHE
      threads: 4